<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Stockity AI Signal HUD</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 6px;
      color: #f8fafc;
    }
    p {
      margin: 0 0 12px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-weight: 600;
    }
    button:hover {
      filter: brightness(1.08);
    }
    #msg {
      font-size: 11px;
      color: #38bdf8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Stockity AI Signal HUD</h1>
  <p>Tampilkan panel analisa AI (Bollinger Bands + Momentum) di tab aktif Stockity Anda.</p>
  <button id="toggleHudBtn">Tampilkan / Sembunyikan Panel</button>
  <button id="pickBtn" class="secondary">🎯 Pilih Elemen Harga di Halaman</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
